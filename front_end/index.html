<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="monitor-box">
        <div class="monitor-stats">
            <p>CPU: <span id="cpu">Loading...</span></p>

            <div class="progress-bar">
                <div class="progress-fill" id="cpu-bar"></div>
            </div>
        </div>
        <div class="monitor-stats">
            <p>RAM: <span id="ram">Loading...</span></p>

            <div class="progress-bar">
                <div class="progress-fill" id="ram-bar"></div>
            </div>
        </div>
        <div class="monitor-stats">
            <p>Storage: <span id="storage">Loading...</span></p>

            <div class="progress-bar">
                <div class="progress-fill" id="storage-bar"></div>
            </div>
        </div>
        <div class="monitor-stats">
            <p>Temp: <span id="temp">Loading...</span></p>
        </div>
        <div class="monitor-stats">
            <p>Upload: <span id="upload">Loading...</span></p>
        </div>
        <div class="monitor-stats">
            <p>Download: <span id="download">Loading...</span></p>
        </div>
        
        <script src="dashboard.js"></script>
    </div>

    <div class="service-box">
        <h2>Server Services</h2>
        
        <p>Jellyfin: <span id="jellyfin">Loading...</span></p>
        <p>PiHole: <span id="pihole">Loading...</span></p>
        <p>qbittorrent: <span id="qbittorrent">Loading...</span></p>
        <p>nginx: <span id="nginx">Loading...</span></p>
    </div>
</body>
</html>
